[project]
name = "bandwidth-infrastructure-agent"
version = "0.1.1"
description = "Evidence-based infrastructure cost reviews using GitHub Apps and Amazon Bedrock"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
infrastructure-agent = "reviewer.infra.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
